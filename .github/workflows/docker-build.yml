name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  # tag-release.yml（Actions の画面から手で実行）がタグを打ってから呼ぶ。GITHUB_TOKEN で push したタグでは
  # ワークフローが起動しないため、push を待たずに直接呼んでもらう。そのタグは github.sha に付いているので、
  # checkout（既定で github.sha）・checks・smoke もそのタグと同じコミットを見る。
  # 失敗した実行の作り直しは、Actions の画面の Re-run で行う（以前の workflow_dispatch はやめた）。
  workflow_call:
    inputs:
      version:
        description: 'Version without "v" (e.g., 1.2.3). The tag vX.Y.Z must already point at github.sha'
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ブランチでは差分で間引いた検査を、リリースでは全部回す。定義はブランチの CI と同じ
  # 再利用ワークフロー（二重に書かない）。checks は build と並走する。
  checks:
    uses: ./.github/workflows/checks.yml

  # スモーク。push したばかりの本番イメージそのもの（＝デプロイするもの）で回す。
  # 作り直したイメージで通っても、本番に出すものの確認にならない
  smoke:
    needs: build
    uses: ./.github/workflows/smoke.yml
    with:
      image: ${{ needs.build.outputs.image }}

  build:
    runs-on: ubuntu-latest
    # ふだんは 2 分ほど（キャッシュなしで組み直す）。固まったときに既定の 6 時間待たない
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      # smoke が pull するイメージ（metadata-action の {{version}} と同じ値）
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
      # release のノートの起点。前回のタグが無ければ空
      # （DB は起動時の db:prepare が当てるキャッシュなので、手で当てるマイグレーションは無い。has_migration は出さない）
      prev_tag: ${{ steps.prev.outputs.prev_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 前回のタグを取るため履歴ごと取る
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # マニフェストに書く値（v なしのセメンティックバージョン）。例: refs/tags/v1.2.3 -> 1.2.3。
      # 入力は `${{ }}` で run: に直接埋めない（値に `"` や `$(...)` があればそのまま実行される）。環境変数で渡す
      - name: Extract version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=${INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}" >> "$GITHUB_OUTPUT"

      - name: Find previous tag
        id: prev
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV_TAG:-(none)}"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # tag-release.yml から呼ばれたときは github.ref が main なので、版は value で渡す
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      # apt-get の RUN レイヤがキャッシュされると OS パッケージのセキュリティ修正が入らない
      # （CVE-2026-111497 の libbrotli1 がこれで古いまま残った）。リリースは毎回ベースイメージを pull し、
      # キャッシュを読まずに組み直す（no-cache は読み出しだけを止める。cache-to は書く）。
      # ブランチのスモーク（smoke.yml）はここで積む buildcache を読む。GitHub Actions のキャッシュ（type=gha）は
      # タグの実行で積んだものをブランチから読めないので、レジストリに置く。
      # イメージ自体は検査の結果を待たずに push され、latest も動く。本番は版を固定していて
      # latest をデプロイに使わない（docs/development.md「リリース」）。
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,compression-level=3

  # GitHub Release をタグごと（パッチも含む）に作る。全検査が通ったときだけ＝Release がある版はデプロイしてよい版。
  # ノートは GitHub の自動生成（前回のタグからマージされた PR の一覧・英語。分類は .github/release.yml）。
  # 同じノートを create-k8s-pr がデプロイの PR 本文に使う（変更の一覧の出どころを1つにする）。
  release:
    needs: [build, checks, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # generate-notes API も Release の作成も contents: write が要る
      contents: write
    outputs:
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      # 前回のタグは明示する。省くと GitHub は前回の「Release」を起点にするので、
      # Release を作っていない範囲があると起点がずれる。
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PREV_TAG: ${{ needs.build.outputs.prev_tag }}
        run: |
          args=(-f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA")
          if [ -n "$PREV_TAG" ]; then args+=(-f previous_tag_name="$PREV_TAG"); fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          {
            echo "notes<<NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # タグ名は GITHUB_REF_NAME ではなく版から作る（tag-release.yml から呼ばれたときは ref が main のため）
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  create-k8s-pr:
    # 検査が全部（ビルド・checks・スモーク）通ったときだけ k8s マニフェストへ PR する（release が同じ条件で
    # 待っているので、それを待てば足りる）。マニフェストのリポジトリは Flux 同期なので、この PR のマージが
    # そのまま本番へのデプロイになる。
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # マニフェストのリポジトリは非公開。このリポジトリの Actions のログは誰でも読めるので、リポジトリ名と
      # マニフェストのパス（同じイメージを使う prd のもの、スペース区切り）もシークレットに置き、ログでは伏せる
      K8S_REPO: ${{ secrets.K8SG1_REPO }}
      K8S_MANIFEST_PATHS: ${{ secrets.K8SG1_MANIFEST_PATHS }}

    steps:
      - name: Checkout k8s repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.K8S_REPO }}
          token: ${{ secrets.K8SG1_PAT }}
          path: k8s-repo

      # マニフェストの書式が変わって sed が何も書き換えないと、差分が無いので create-pull-request は
      # PR を作らずに黙って成功する（＝デプロイされないのに緑）。書き換わったことを確かめて落とす
      - name: Update image tag
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        working-directory: k8s-repo
        run: |
          repo="${IMAGE%:*}"
          for p in $K8S_MANIFEST_PATHS; do
            sed -i "s|image: ${repo}:.*|image: ${IMAGE}|" "$p"
            grep -q "image: ${IMAGE}$" "$p" || { echo "::error file=$p::image line not updated"; exit 1; }
          done

      # 本文は英語・全アプリ共通の書式（イメージ・ビルドのリンク・release ジョブが生成したノート）。
      # ノートの PR は完全な URL で書かれるので、マニフェストのリポジトリの #N へのリンクに化けない。
      # DB は起動時の db:prepare が当てるキャッシュなので、マイグレーションの節は無い。
      - name: Write PR body
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          NOTES: ${{ needs.release.outputs.notes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "- Image: \`$IMAGE\`"
            echo "- Build: $RUN_URL"
            echo
            printf '%s\n' "$NOTES"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          path: k8s-repo
          token: ${{ secrets.K8SG1_PAT }}
          branch: update-instance-info-api-${{ needs.build.outputs.version }}
          delete-branch: true
          # マニフェストのリポジトリには PR が大量に来るので、自分に assign して「Assigned to you」で見落とさないようにする
          assignees: ${{ github.repository_owner }}
          commit-message: Update instance-info-api to ${{ needs.build.outputs.version }}
          title: Update instance-info-api to ${{ needs.build.outputs.version }}
          body-path: ${{ runner.temp }}/pr-body.md
          # app-update: マニフェストのリポジトリに大量に来る PR のうちアプリの版上げを見分ける（全アプリ共通）
          labels: app-update
