name: Smoke

# 本番と同じイメージを起動して API が答えることを確かめる（中身は .github/scripts/smoke.sh。手元でも同じ）。
# ブランチ push（ci.yml）ではここでイメージをビルドする（push はしない）。
on:
  workflow_call:
    inputs:
      # 指定するとビルドせず、このイメージ（push 済み）で回す。タグ時に、デプロイするイメージ
      # そのものを確かめるため（作り直したイメージで通っても、本番に出すものの確認にならない）。
      image:
        type: string
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    # ふだんは数分。固まったときに既定の 6 時間待たない
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SMOKE_IMAGE: ${{ inputs.image || 'instance-info-api:smoke' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: ${{ !inputs.image }}
        uses: docker/setup-buildx-action@v4

      # タグ時のビルド（docker-build.yml）が積む buildcache を読む（イメージは公開なのでログインは要らない）。
      # Gemfile.lock が同じなら bundle install のレイヤも再利用される。
      - name: Build production image (no push)
        if: ${{ !inputs.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: instance-info-api:smoke
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache

      - name: Smoke test image
        run: .github/scripts/smoke.sh "$SMOKE_IMAGE"
