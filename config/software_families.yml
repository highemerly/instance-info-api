# Mapping of canonical fediverse software family names to their variants /
# forks as returned in nodeinfo's `software.name` field.
#
# When the API receives a softwarename listed here, it is normalized to the
# canonical key. The raw softwarename is preserved in the `software`
# response field. Unmapped softwarenames are returned as-is for both `type`
# and `software`.
#
# Add new forks here when instances start reporting them.
# Run `rake fediverse:check_unknown_software` (if defined) to surface any
# softwarename not covered by this map.

mastodon:
  - mastodon
  - hometown
  - glitch-soc
  - fedibird

pleroma:
  - pleroma
  - akkoma

misskey:
  - misskey
  - firefish
  - calckey
  - sharkey
  - iceshrimp
  - foundkey
  - cherrypick
  - meisskey

# Iceshrimp.NET is a rewrite, not a Misskey fork (its nodeinfo name is
# "Iceshrimp.NET"; the older JS "iceshrimp" above is a Misskey fork).
iceshrimp.net:
  - iceshrimp.net

lemmy:
  - lemmy

# Mbin (and kbin, which it forked from) is a link aggregator like Lemmy, but
# its web UI is different (no /create_post), so it is its own family.
mbin:
  - mbin
  - kbin

piefed:
  - piefed

mitra:
  - mitra

pixelfed:
  - pixelfed

peertube:
  - peertube

friendica:
  - friendica

hubzilla:
  - hubzilla

gnusocial:
  - gnusocial
  - statusnet
  - postactiv

gotosocial:
  - gotosocial

snac:
  - snac

funkwhale:
  - funkwhale

bookwyrm:
  - bookwyrm

writefreely:
  - writefreely

plume:
  - plume
