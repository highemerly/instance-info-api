services:
  api:
    build: .
    ports:
      - "3001:3000"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=instanceapi
      - DB_USER=instanceapi
      - DB_PASS=REDACTED
      - SECRET_KEY_BASE=REDACTED
    # 既存のMySQLコンテナと同じネットワークに参加
    networks:
      - hosteka_hosteka-network

networks:
  hosteka_hosteka-network:
    external: true
